server:
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  server:
    password: "${LAVALINK_PASSWORD:changeme123}"
    sources:
      youtube: false  # off: YouTube blocks datacenter IPs; we use SoundCloud instead
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""

logging:
  file:
    path: ./logs/
  # Rolling policy tuned for a tiny droplet. ./logs/ is a tmpfs (RAM) mount, so
  # these caps bound memory use, not just disk. Archived segments are gzip-
  # compressed automatically (Spring Boot's default file-name-pattern ends
  # in .gz), so real coverage is far more than the raw byte caps suggest.
  logback:
    rollingpolicy:
      # Roll the active (uncompressed) file at this size.
      max-file-size: 5MB
      # Hard ceiling on all rolled+compressed archives combined. With the
      # active file that keeps the whole ./logs/ dir well under 50MB.
      total-size-cap: 30MB
      # Also prune by age so stale archives can't linger.
      max-history: 7
  level:
    root: INFO
    lavalink: INFO
