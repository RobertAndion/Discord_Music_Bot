name: CI - Build & Test

# Run tests on every pull request to ensure code quality before merge
on:
  pull_request:
    branches: [master, main]
  push:
    branches: [feature/*, fix/*]  # Also run on feature branches
  workflow_dispatch:

# Cancel in-progress runs for the same PR to save resources
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Job 1: Code Quality & Tests
  test:
    name: Run Tests & Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-mock flake8

      - name: Run linting (flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Check for additional issues (warnings don't fail the build)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Create test directories
        run: |
          mkdir -p ServerData
          mkdir -p tests

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing --tb=short || true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Job 2: Docker Image Build Test
  docker-build:
    name: Test Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Docker/Dockerfile
          push: false
          load: true  # Load image to local docker daemon for testing
          tags: discord-music-bot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            LAVALINK_VERSION=4.2.2

      - name: Test Docker image
        run: |
          # Basic sanity check - ensure the image was built
          docker images discord-music-bot:test

          # Check that required files exist in the image
          docker run --rm discord-music-bot:test ls -la /MusicBot/bot.py
          docker run --rm discord-music-bot:test ls -la /MusicBot/Cogs/

          # Verify Python dependencies are installed
          docker run --rm discord-music-bot:test python3 -c "import discord; import lavalink; print('Dependencies OK')"

  # Job 3: Configuration Validation
  validate-config:
    name: Validate Configuration Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate JSON configuration files
        run: |
          # Check if config.json is valid JSON
          python3 -m json.tool Resources/config.json > /dev/null
          echo "✅ config.json is valid JSON"

      - name: Validate YAML configuration files
        run: |
          # Check if application.yml is valid YAML
          python3 -c "import yaml; yaml.safe_load(open('application.yml'))"
          echo "✅ application.yml is valid YAML"

      - name: Validate workflow files
        run: |
          # Check GitHub workflow syntax
          for workflow in .github/workflows/*.yml; do
            python3 -c "import yaml; yaml.safe_load(open('$workflow'))"
            echo "✅ $workflow is valid YAML"
          done

  # Job 4: Security Scan
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.16.1
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 5: Python Dependency Check
  dependencies:
    name: Check Python Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for security vulnerabilities
        run: |
          pip install safety
          safety check --full-report || true
        continue-on-error: true

      - name: Check for outdated dependencies
        run: |
          pip install pip-check
          pip-check || true
        continue-on-error: true

  # Summary Job
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, docker-build, validate-config, security-scan, dependencies]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Test results
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ Tests: PASSED" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test.result }}" == "failure" ]; then
            echo "❌ Tests: FAILED" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          # Docker build results
          if [ "${{ needs.docker-build.result }}" == "success" ]; then
            echo "✅ Docker Build: PASSED" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.docker-build.result }}" == "failure" ]; then
            echo "❌ Docker Build: FAILED" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Docker Build: ${{ needs.docker-build.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          # Config validation results
          if [ "${{ needs.validate-config.result }}" == "success" ]; then
            echo "✅ Config Validation: PASSED" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.validate-config.result }}" == "failure" ]; then
            echo "❌ Config Validation: FAILED" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Config Validation: ${{ needs.validate-config.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Ready for Review!" >> $GITHUB_STEP_SUMMARY
