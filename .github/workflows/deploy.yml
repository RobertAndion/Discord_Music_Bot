name: Deploy to DigitalOcean

# Deploys on every push to master, or manually via the Actions tab.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two deploys at once; cancel an in-progress one if a newer push lands.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & restart on droplet
    runs-on: ubuntu-latest
    # Native ssh (below) streams the remote build output live into this log.
    timeout-minutes: 40
    steps:
      - name: Deploy over SSH (streaming)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/musicbot' }}
          DEPLOY_BRANCH: master
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          LAVALINK_PASSWORD: ${{ secrets.LAVALINK_PASSWORD }}
          # Optional: absolute path to persistent data on a mounted block-storage
          # volume (see deploy/README.md). Empty -> Docker named volumes.
          MUSICBOT_DATA_DIR: ${{ secrets.MUSICBOT_DATA_DIR }}
        run: |
          set -euo pipefail

          # --- Set up the SSH key and host verification ---
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DROPLET_SSH_PORT" -H "$DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # --- Run the deploy, streaming remote stdout/stderr live ---
          # Secrets are passed as the remote bash's environment; the heredoc is
          # the script it runs (quoted so it expands on the droplet, not here).
          # -tt forces a pseudo-TTY on the remote so its output is line-buffered
          # and flushed immediately — without it, docker build output is
          # block-buffered over the pipe and only appears when the step finishes.
          # ServerAlive* keeps the connection from sitting silently long enough
          # for an intermediate network hop to drop it once the deploy is done.
          # The trailing `exit` forces the remote shell to close the session
          # itself instead of relying on stdin EOF to propagate over the pty —
          # without it, ssh can hang after the script finishes and the run only
          # ends when the idle connection is dropped ("Broken pipe", exit 255),
          # even though the deploy itself already completed successfully.
          ssh -tt -i ~/.ssh/deploy_key -p "$DROPLET_SSH_PORT" \
              -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              "$DROPLET_USER@$DROPLET_HOST" \
              "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_BRANCH='$DEPLOY_BRANCH' \
               DISCORD_TOKEN='$DISCORD_TOKEN' LAVALINK_PASSWORD='$LAVALINK_PASSWORD' \
               MUSICBOT_DATA_DIR='$MUSICBOT_DATA_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          echo "==> Syncing code to origin/$DEPLOY_BRANCH"
          git fetch --all --prune
          git reset --hard "origin/$DEPLOY_BRANCH"
          git clean -fd -e .env -e Lavalink.jar
          bash deploy/deploy.sh
          exit
          REMOTE
